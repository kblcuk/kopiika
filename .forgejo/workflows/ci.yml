name: CI
on:
    push:
        branches: [main]
    pull_request:

# One job on purpose. The runner is single-slot, so extra jobs queue rather than
# overlap and each one re-pays ~37s of apt-get + bun install: measured on run
# #389, a 4-leg matrix plus a test job took ~5min against the 1m14s the single
# job used to take. Parallelism therefore has to happen inside the job, where
# the setup is paid once.

jobs:
    check:
        runs-on: docker
        container:
            image: node:lts-bookworm-slim
        steps:
            - name: Checkout
              uses: https://code.forgejo.org/actions/checkout@v4

            - name: Install OS dependencies (curl et al)
              run: apt-get update -qq && apt-get install -y -qq curl git unzip > /dev/null

            - name: Install bun
              run: |
                  curl -fsSL https://bun.sh/install | bash
                  echo "$HOME/.bun/bin" >> $GITHUB_PATH

            - name: Setup cache
              uses: https://code.forgejo.org/actions/cache@v6
              with:
                  path: node_modules
                  key: modules-${{ hashFiles('bun.lock') }}

            - name: Install dependencies
              env:
                  BUN_CONFIG_DNS_PREFER: ipv4
              run: bun install --frozen-lockfile

            # Runs all four concurrently and collects every exit code, so one run
            # reports every failing check rather than stopping at the first. That
            # is strictly more than `bun run checks` (&&-chained) or `mise run
            # checks` (first failure SIGTERMs its siblings) can report.
            - name: Static checks
              run: |
                  set -u
                  CHECKS="fmt:check lint types unused"
                  for t in $CHECKS; do
                      (bun run "$t" > "/tmp/$t.log" 2>&1; echo $? > "/tmp/$t.rc") &
                  done
                  wait
                  fail=0
                  for t in $CHECKS; do
                      rc=$(cat "/tmp/$t.rc")
                      if [ "$rc" = 0 ]; then
                          echo "----- PASS $t -----"
                      else
                          echo "----- FAIL $t (exit $rc) -----"
                          fail=1
                      fi
                      cat "/tmp/$t.log"
                  done
                  echo "----- summary -----"
                  for t in $CHECKS; do
                      echo "$t: $([ "$(cat /tmp/$t.rc)" = 0 ] && echo PASS || echo FAIL)"
                  done
                  exit $fail

            - name: Unit and component tests
              run: bun run test
