name: Renovate
on:
    schedule:
        # Saturday 05:00 UTC ≈ 07:00 CEST / 08:00 Kyiv
        - cron: '0 5 * * 6'
    workflow_dispatch:
        inputs:
            dry-run:
                description: 'Dry run (analyse only, no PRs created)'
                type: boolean
                default: false
            log-level:
                description: 'Renovate log level'
                type: choice
                options: [info, debug]
                default: info

jobs:
    renovate:
        runs-on: docker
        container:
            image: ghcr.io/renovatebot/renovate:latest
        steps:
            - name: Run Renovate
              run: renovate
              env:
                  RENOVATE_PLATFORM: gitea
                  RENOVATE_ENDPOINT: https://codeberg.org/
                  RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
                  RENOVATE_REPOSITORIES: kblcuk/kopiika
                  RENOVATE_AUTODISCOVER: 'false'
                  RENOVATE_BINARY_SOURCE: install
                  RENOVATE_DRY_RUN: ${{ github.event.inputs.dry-run == 'true' && 'full' || '' }}
                  LOG_LEVEL: ${{ github.event.inputs.log-level || 'info' }}
