name: Avrea Smoke

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    linux:
        name: Linux runner
        runs-on: avrea-ubuntu-latest-2-vcpu
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Inspect Linux image
              run: |
                  set -euxo pipefail
                  uname -a
                  test -e /dev/kvm && ls -l /dev/kvm || true
                  node --version
                  java -version
                  echo "ANDROID_HOME=${ANDROID_HOME:-}"
                  echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
                  command -v sdkmanager || true
                  command -v emulator || true

    macos:
        name: macOS runner
        runs-on: avrea-macos-26-8-vcpu
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Inspect macOS image
              run: |
                  set -euxo pipefail
                  sw_vers
                  xcodebuild -version
                  xcrun simctl list devices available | head -120
                  node --version
                  ruby --version
                  echo "ANDROID_HOME=${ANDROID_HOME:-}"
                  echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
                  command -v emulator || true
