name: Avrea E2E

on:
    workflow_dispatch:
        inputs:
            platform:
                description: Platform to run
                type: choice
                options: [all, ios, android]
                default: all
            android-suite:
                description: Android suite to run while proving emulator stability
                type: choice
                options: [launch, full]
                default: launch
            force:
                description: Run even if this commit already has a successful E2E marker
                type: boolean
                default: false

permissions:
    contents: read

env:
    BUN_CONFIG_DNS_PREFER: ipv4
    CI: '1'
    EXPO_NO_TELEMETRY: '1'

jobs:
    ios:
        name: iOS E2E
        if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
        runs-on: avrea-macos-26-8-vcpu
        timeout-minutes: 90
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Restore success marker
              id: success-marker
              uses: actions/cache/restore@v4
              with:
                  path: .e2e-success/ios
                  key: e2e-success-ios-${{ github.sha }}

            - name: Skip already successful commit
              if: ${{ steps.success-marker.outputs.cache-hit == 'true' && !inputs.force }}
              run: echo "iOS E2E already passed for $GITHUB_SHA"

            - name: Setup Bun
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: oven-sh/setup-bun@v2

            - name: Setup Ruby
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.4'
                  bundler-cache: true

            - name: Restore Bun package cache
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-cache-macos-${{ hashFiles('bun.lock') }}

            - name: Restore Detox framework cache
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              id: detox-framework-cache
              uses: actions/cache@v4
              with:
                  path: ~/Library/Detox
                  key: detox-ios-framework-macos26-xcode26.2-${{ hashFiles('bun.lock') }}

            - name: Install JS dependencies
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bun install --frozen-lockfile

            - name: Build Detox framework cache
              if: ${{ (steps.success-marker.outputs.cache-hit != 'true' || inputs.force) && steps.detox-framework-cache.outputs.cache-hit != 'true' }}
              run: bunx detox build-framework-cache

            - name: Install applesimutils
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: |
                  if ! command -v applesimutils >/dev/null 2>&1; then
                      brew tap wix/brew
                      brew install applesimutils
                  fi

            - name: Inspect simulator image
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: |
                  set -euxo pipefail
                  xcodebuild -version
                  xcrun simctl list devices available | grep -E 'iPhone (16e|17|17 Pro)' || true

            - name: Generate iOS project
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bunx expo prebuild --clean --platform ios

            - name: Build iOS Detox app
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bun run build:e2e:ios

            - name: Run iOS Detox suite
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bun run test:e2e:ios

            - name: Write success marker
              if: ${{ success() && (steps.success-marker.outputs.cache-hit != 'true' || inputs.force) }}
              run: |
                  mkdir -p .e2e-success/ios
                  printf '%s\n' "$GITHUB_SHA" > .e2e-success/ios/sha

            - name: Save success marker
              if: ${{ success() && steps.success-marker.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: .e2e-success/ios
                  key: e2e-success-ios-${{ github.sha }}

    android:
        name: Android E2E
        if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
        runs-on: avrea-macos-26-8-vcpu
        timeout-minutes: 90
        env:
            DETOX_ANDROID_AVD: Pixel9
            ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Restore success marker
              id: success-marker
              uses: actions/cache/restore@v4
              with:
                  path: .e2e-success/android-${{ inputs['android-suite'] }}
                  key: e2e-success-android-${{ inputs['android-suite'] }}-${{ github.sha }}

            - name: Skip already successful commit
              if: ${{ steps.success-marker.outputs.cache-hit == 'true' && !inputs.force }}
              run: echo "Android ${{ inputs['android-suite'] }} E2E already passed for $GITHUB_SHA"

            - name: Inspect Android emulator image
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: |
                  set -euxo pipefail
                  sw_vers
                  echo "ANDROID_HOME=${ANDROID_HOME:-}"
                  echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
                  command -v emulator || true
                  emulator -version || true

            - name: Setup Java
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Setup Bun
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: oven-sh/setup-bun@v2

            - name: Setup Gradle
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: gradle/actions/setup-gradle@v5

            - name: Restore Bun package cache
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: bun-cache-android-macos-${{ hashFiles('bun.lock') }}

            - name: Install JS dependencies
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bun install --frozen-lockfile

            - name: Generate Android project
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bunx expo prebuild --clean --platform android

            - name: Build Android Detox app
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              run: bunx detox build --configuration android.emu.debug --config-path ./e2e/detox.android.ci.js

            - name: Run Android Detox suite
              if: ${{ steps.success-marker.outputs.cache-hit != 'true' || inputs.force }}
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 35
                  target: google_apis
                  arch: arm64-v8a
                  profile: pixel_7
                  avd-name: ${{ env.DETOX_ANDROID_AVD }}
                  disable-animations: false
                  emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel off
                  script: |
                      if [ "${{ inputs['android-suite'] }}" = "full" ]; then
                          bunx detox test --configuration android.emu.debug --config-path ./e2e/detox.android.ci.js
                      else
                          bunx detox test --configuration android.emu.debug --config-path ./e2e/detox.android.ci.js e2e/tests/launch.test.ts
                      fi

            - name: Write success marker
              if: ${{ success() && (steps.success-marker.outputs.cache-hit != 'true' || inputs.force) }}
              run: |
                  mkdir -p .e2e-success/android-${{ inputs['android-suite'] }}
                  printf '%s\n' "$GITHUB_SHA" > .e2e-success/android-${{ inputs['android-suite'] }}/sha

            - name: Save success marker
              if: ${{ success() && steps.success-marker.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@v4
              with:
                  path: .e2e-success/android-${{ inputs['android-suite'] }}
                  key: e2e-success-android-${{ inputs['android-suite'] }}-${{ github.sha }}
