[env]
HK_MISE = 1
HK_PKL_BACKEND = 'pklr'

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"

[tools]
age = "latest"
bun = "latest"
fnox = "latest"
gradle = "9.6.1"
hk = "latest"
java = "temurin-21.0.12+101.0.LTS"
node = "latest"
ruby = "latest"

# --- Check tasks ---
# The checks themselves stay bun scripts; mise only orchestrates them so they
# run concurrently rather than sequentially (2.6s vs ~5s locally).
#
# `checks` depends on the glob, so a new `checks:*` task joins automatically.
# Caveat: the first failure SIGTERMs its in-flight siblings, and
# --continue-on-error does not change that for parallel deps (checked against
# mise 2026.8.2) — so a failing run still reports only the check that lost the
# race, same as package.json's `&&` chain.

[tasks."checks:lint"]
description = "Lint with oxlint"
run = "bun run lint"

[tasks."checks:fmt"]
description = "Verify formatting with oxfmt"
run = "bun run fmt:check"

[tasks."checks:types"]
description = "Typecheck with tsgo"
run = "bun run types"

[tasks."checks:unused"]
description = "Report unused exports and types with knip"
run = "bun run unused"

[tasks."checks"]
description = "Run every static check in parallel"
depends = ["checks:*"]

# --- E2E tasks ---
# Wraps `detox build | xcpretty && detox test` with bash pipefail so a failing
# xcodebuild propagates correctly. Fish's `cmd | xcpretty && next` ANDs on
# xcpretty's status, which silently masks build failures and re-runs Detox
# against the previous binary.

[tasks."e2e:ios:build"]
description = "Build the iOS E2E binary (with xcpretty)"
run = """
set -eo pipefail
bun run build:e2e:ios | xcpretty
"""

[tasks."e2e:ios:test"]
description = "Run iOS E2E tests"
run = """
bunx detox test --configuration ios.sim.debug "$@"
"""

[tasks."e2e:ios"]
description = "Build the iOS E2E binary (with xcpretty) and run Detox tests"
run = [{ task = "e2e:ios:build" }, { task = "e2e:ios:test" }]

[tasks."e2e:android"]
description = "Build the Android E2E binary and run Detox tests"
run = """
set -eo pipefail
bun run build:e2e:android
bunx detox test --configuration android.emu.debug "$@"
"""


# --- Release tasks ---
# mise is the single implementation layer for release commands.
# Bun keeps app/dev/versioning commands; deployment and store orchestration live here.
#
# Every fastlane call is wrapped in `fnox exec --`, which injects the secrets
# for that process only. The `_.fnox-env` mise plugin used to export them into
# every mise invocation instead, so any task — and `mise env` — carried the full
# decrypted set. fastlane is the only consumer (the secret names appear nowhere
# else outside docs/RELEASING.md), so nothing else needs them: the checks and
# e2e tasks are secret-free, and gradle's release build type signs with the
# debug config, so `e2e:android` never touches the upload keystore.

[tasks."ios:doctor"]
description = "Validate App Store Connect credentials for the current iOS version"
run = "fnox exec -- bundle exec fastlane ios doctor"

[tasks."ios:setup"]
description = "Sync iOS development and App Store signing assets via match"
run = "fnox exec -- bundle exec fastlane ios setup_signing"

[tasks."ios:build"]
description = "Build an iOS archive using the current app.json version metadata"
run = "fnox exec -- bundle exec fastlane ios build"

[tasks."ios:upload"]
description = "Upload the latest iOS build to TestFlight without rebuilding"
run = "fnox exec -- bundle exec fastlane ios upload"

[tasks."ios:promote:external"]
description = "Promote an uploaded TestFlight build to external tester groups"
run = "fnox exec -- bundle exec fastlane ios promote_external"

[tasks."ios:beta"]
description = "Build and upload iOS beta to TestFlight"
run = "fnox exec -- bundle exec fastlane ios beta"

[tasks."ios:cleanup"]
description = "Expire old TestFlight builds"
run = "fnox exec -- bundle exec fastlane ios cleanup"

[tasks."android:build:release"]
description = "Build Android release bundle (.aab)"
run = "fnox exec -- bundle exec fastlane android build"

[tasks."android:doctor"]
description = "Validate Google Play credentials and package access"
run = "fnox exec -- bundle exec fastlane android doctor"

[tasks."android:upload"]
description = "Upload an Android bundle to Google Play"
run = "fnox exec -- bundle exec fastlane android upload"

[tasks."android:beta"]
description = "Build and upload Android beta to internal track"
run = "fnox exec -- bundle exec fastlane android beta"

[tasks."android:production"]
description = "Build and upload Android production release"
run = "fnox exec -- bundle exec fastlane android production"

[tasks."android:promote"]
description = "Promote an existing Android release between Play tracks"
run = "fnox exec -- bundle exec fastlane android promote"

[tasks."android:cleanup"]
description = "Prune old Google Play track releases"
run = "fnox exec -- bundle exec fastlane android cleanup"

[tasks."release:doctor"]
description = "Run iOS and Android release preflight checks"
run = [
  "fnox exec -- bundle exec fastlane ios doctor",
  "fnox exec -- bundle exec fastlane android doctor",
]

[tasks."release:tag"]
description = "Bump the version, write the changelog, tag, and offer to push"
# raw connects stdin directly so the push confirmation can read a TTY. Without it mise
# pipes stdin and the prompt is skipped as non-interactive.
raw = true
run = "scripts/tag-release.sh"

[tasks."release:sync-build-numbers"]
description = "Sync app.json build numbers from App Store Connect and Google Play"
run = "fnox exec -- bundle exec fastlane sync_build_numbers"

[tasks."release:notify"]
description = "Send Telegram release notification"
run = "fnox exec -- bundle exec fastlane notify_telegram"

[tasks."release:cleanup-builds"]
description = "Clean up old TestFlight builds and stale Play track releases"
run = [
  "fnox exec -- bundle exec fastlane ios cleanup",
  "fnox exec -- bundle exec fastlane android cleanup",
]

[tasks."release:beta"]
description = "Ship iOS + Android betas in parallel, then notify Telegram"
run = [
  "fnox exec -- bundle exec fastlane sync_build_numbers",
  { tasks = [
    "ios:beta",
    "android:beta",
  ] },
  "fnox exec -- bundle exec fastlane notify_telegram platform:'iOS + Android (Beta)'",
]

[tasks."release:production"]
description = "Ship iOS beta + Android production in parallel, then notify Telegram"
run = [
  "fnox exec -- bundle exec fastlane sync_build_numbers",
  { tasks = [
    "ios:beta",
    "android:production",
  ] },
  "fnox exec -- bundle exec fastlane notify_telegram platform:'iOS + Android (Production)'",
]
